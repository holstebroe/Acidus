name: Build Syrebas CLAP Plugin

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: syrebas-${{ runner.os }}
        path: |
          build/syrebas.clap
          build/Release/syrebas.clap
          build/syrebas.vst3
          build/Release/syrebas.vst3
        if-no-files-found: ignore

  release:
    needs: build
    # Only run release job on tag pushes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to post GitHub releases

    steps:
    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: syrebas-Linux
        path: release-raw/Linux

    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: syrebas-Windows
        path: release-raw/Windows

    - name: Download macOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: syrebas-macOS
        path: release-raw/macOS

    - name: Package Archives for Release
      run: |
        mkdir dist
        cd release-raw/Linux && zip -r ../../dist/Syrebas-Linux-${{ github.ref_name }}.zip . && cd ../..
        cd release-raw/Windows && zip -r ../../dist/Syrebas-Windows-${{ github.ref_name }}.zip . && cd ../..
        cd release-raw/macOS && zip -r ../../dist/Syrebas-macOS-${{ github.ref_name }}.zip . && cd ../..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
